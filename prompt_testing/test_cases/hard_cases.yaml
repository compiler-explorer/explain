- id: hard_rust_iter_vs_index
  category: hard_rust_bounds_checks
  description: "Both Rust loops are vectorised with SSE2, which lacks a 32-bit vector multiply, so squares are built from
    pshufd / pmuludq / punpckldq. In the indexed version the bounds check is hoisted into one test before the loop (n - 1
    against the slice length, then panic_bounds_check); there is no per-iteration check. Without overflow checks in release
    mode the multiplications and sum wrap silently."
