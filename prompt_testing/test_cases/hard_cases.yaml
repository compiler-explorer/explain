    code: |
      int table[1024];

      int find_index(int key) {
          for (int i = 0; i < 1024; i++)
              if (table[i] == key)
                  return i;
          return -1;
      }

      unsigned long len_of(const char *s) {
          unsigned long n = 0;
          while (s[n])
              n++;
          return n;
