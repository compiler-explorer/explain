- id: hard_rust_enum_match
  category: hard_rust_enum_layout
  description: "A data-carrying enum is a tagged union: an 8-byte discriminant at offset 0 and the f64 payloads from offset
    8. The match is a jump table of 32-bit relative offsets reached with an indirect jmp; each arm loads its payload from
    different offsets, and the Tri arm evaluates Heron's formula with sqrtsd. Circle's constant is pi loaded from memory.
    The Point arm is just a zeroed register."
  audience: beginner
  explanation_type: assembly
  input:
    language: Rust
    compiler: rustc 1.93.0
    compilationOptions: ["-C", "opt-level=3"]
    instructionSet: x86_64
    code: |
      pub enum Shape {
          Circle(f64),
          Rect(f64, f64),
          Tri(f64, f64, f64),
          Point,
      }

      #[inline(never)]
      pub fn area(s: &Shape) -> f64 {
          match *s {
              Shape::Circle(r) => 3.14159 * r * r,
              Shape::Rect(w, h) => w * h,
              Shape::Tri(a, b, c) => {
                  let p = (a + b + c) / 2.0;
                  (p * (p - a) * (p - b) * (p - c)).sqrt()
              }
              Shape::Point => 0.0,
          }
      }
