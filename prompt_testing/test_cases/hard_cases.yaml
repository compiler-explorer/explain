- id: hard_digit_loop
  category: hard_digit_extraction
  description: "Digit-sum loop where both n / 10 and n % 10 come from one reciprocal multiply (the remainder is rebuilt as
    n - 10*q). The loop test is cmp edi, 9 / ja placed before the mov that replaces n with the quotient: mov does not touch
    flags, so the branch tests the OLD n (n > 9 means the new n is non-zero). Flag-versus-register ordering is a classic misreading."
  audience: beginner
  explanation_type: assembly
  input:
    language: C++
    compiler: x86-64 clang 20.1.0
    compilationOptions: ["-O2"]
    instructionSet: x86_64
    code: |
      int digit_sum(unsigned n) {
          int sum = 0;
          while (n != 0) {
              sum += n % 10;
              n /= 10;
          }
          return sum;
      }
    asm:
    - text: 'digit_sum(unsigned int):'
    - text: '        xor     eax, eax'
      source:
        line: 1
    - text: '        test    edi, edi'
      source:
        line: 3
    - text: '        je      .LBB0_3'
      source:
        line: 3
      labels:
      - name: .LBB0_3
        range:
          startCol: 17
          endCol: 24
    - text: '        mov     ecx, 3435973837'
      source:
        line: 0
    - text: '.LBB0_2:'
    - text: '        mov     edx, edi'
      source:
        line: 5
    - text: '        imul    rdx, rcx'
      source:
        line: 5
    - text: '        shr     rdx, 35'
      source:
        line: 5
    - text: '        lea     esi, [rdx + rdx]'
      source:
        line: 5
    - text: '        lea     esi, [rsi + 4*rsi]'
      source:
        line: 5
    - text: '        mov     r8d, edi'
      source:
        line: 5
    - text: '        sub     r8d, esi'
      source:
        line: 5
    - text: '        add     eax, r8d'
      source:
