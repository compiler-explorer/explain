- id: hard_early_exit_search
  category: hard_early_exit_vectorized
  description: "With -O3 -march=haswell the search over a 1024-int global is vectorised: 8-lane compare with vptest, and when
    a block contains the key a long straight-line scalar sequence re-checks each lane to find the exact index (it is not a
    loop). Lane-index vectors are kept in ymm registers. The second function is a hand-written strlen loop that gcc replaces
    with a call to the library strlen on s+1 after a peeled first-byte test."
  audience: experienced
  explanation_type: assembly
  input:
