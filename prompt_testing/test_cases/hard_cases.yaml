- id: hard_arm32_predication
  category: hard_arm32_conditional_execution
  description: "32-bit ARM (Thumb-2) selects results with conditionally executed instructions instead of branches: ite gt
    makes the next two instructions execute on gt and le respectively, so both subgt and suble appear in the stream though
    only one runs. clamp0 is bic with an arithmetic-shifted copy of itself (r0 & ~(r0 >> 31)), sign combines a conditional
    mov with a lsr-by-31 operand, and max3 uses two it lt blocks."
  audience: beginner
  explanation_type: assembly
  input:
    language: C
    compiler: ARM GCC 15.2.0
    compilationOptions: ["-O2"]
    instructionSet: arm32
    code: |
      int abs_diff(int a, int b) { return a > b ? a - b : b - a; }
      int clamp0(int x)          { return x < 0 ? 0 : x; }
      int sign(int x)            { return (x > 0) - (x < 0); }
      int max3(int a, int b, int c) {
          int m = a > b ? a : b;
          return m > c ? m : c;
      }
    asm:
    - text: 'abs_diff:'
    - text: '        cmp     r0, r1'
      source:
        line: 1
    - text: '        ite     gt'
      source:
        line: 1
    - text: '        subgt   r0, r0, r1'
      source:
        line: 1
    - text: '        suble   r0, r1, r0'
      source:
        line: 1
    - text: '        bx      lr'
      source:
        line: 1
    - text: 'clamp0:'
    - text: '        bic     r0, r0, r0, asr #31'
      source:
        line: 2
    - text: '        bx      lr'
      source:
        line: 2
    - text: 'sign:'
    - text: '        cmp     r0, #0'
      source:
        line: 3
    - text: '        ite     gt'
      source:
        line: 3
    - text: '        movgt   r3, #1'
      source:
        line: 3
    - text: '        movle   r3, #0'
      source:
        line: 3
    - text: '        sub     r0, r3, r0, lsr #31'
      source:
        line: 3
    - text: '        bx      lr'
      source:
        line: 3
    - text: 'max3:'
    - text: '        cmp     r0, r2'
      source:
        line: 6
    - text: '        it      lt'
      source:
        line: 6
    - text: '        movlt   r0, r2'
      source:
        line: 6
    - text: '        cmp     r0, r1'
      source:
        line: 7
    - text: '        it      lt'
      source:
        line: 7
    - text: '        movlt   r0, r1'
      source:
        line: 7
    - text: '        bx      lr'
      source:
        line: 7
    labelDefinitions:
      abs_diff: 1
      clamp0: 7
      sign: 10
      max3: 17
