- id: hard_popcount_baseline
  category: hard_bit_builtins_generic
  description: "Without -mpopcnt there is no popcnt instruction: popcount is a SWAR sequence (masks 0x55555555, 0x33333333,
    0x0F0F0F0F, then a multiply by 0x01010101 and shr 24). 64-bit parity folds with xor and reads the parity flag of the low
    byte (xor cl, ch then setnp). 31 - clz collapses to a single bsr, which returns the bit index directly rather than a leading-zero
    count."
  audience: beginner
  explanation_type: assembly
  input:
    language: C
    compiler: x86-64 clang 20.1.0
    compilationOptions: ["-O2"]
    instructionSet: x86_64
    code: |
      int bits_set(unsigned x)    { return __builtin_popcount(x); }
      int parity(unsigned long x) { return __builtin_parityl(x); }
      int log2_floor(unsigned x)  { return 31 - __builtin_clz(x); }
    asm:
    - text: 'bits_set:'
    - text: '        mov     eax, edi'
      source:
        line: 1
    - text: '        shr     eax'
      source:
        line: 1
