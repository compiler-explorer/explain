description: Hard test cases - real compiler output that is easy to misread or over-claim (jump tables, magic-number
  division, speculative devirtualisation, flag semantics, ABI details, vectorised and peeled loops, and
  cross-architecture idioms)
cases:
- id: hard_switch_jumptable
  category: hard_jump_table
  description: "Dense switch lowered to an indirect jump through a table of 32-bit offsets relative to the table (target =
    table base + sign-extended entry). eax is zeroed before the range check so the default needs no block of its own, the
    hole at case 6 points at a bare ret, cases 2 and 3 share one block, and the signed x / 2 block needs a sign fix-up (shr
    31, add, sar) and then falls through into that same ret. Easy to describe as a compare chain or to mis-assign table entries
    to cases."
  audience: experienced
  explanation_type: assembly
  input:
    language: C++
    compiler: x86-64 clang 20.1.0
    compilationOptions: ["-O2"]
    instructionSet: x86_64
    code: |
      int classify(int op, int x) {
          switch (op) {
              case 0: return x + 1;
              case 1: return x * 3;
              case 2:
              case 3: return x - 7;
              case 4: return x << 2;
              case 5: return -x;
              case 7: return x ^ 0x55;
              case 8: return x / 2;
              default: return 0;
          }
      }
    asm:
    - text: 'classify(int, int):'
    - text: '        xor     eax, eax'
      source:
        line: 1
    - text: '        cmp     edi, 8'
      source:
        line: 2
    - text: '        ja      .LBB0_9'
      source:
        line: 2
