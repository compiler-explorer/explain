- id: hard_rust_option_box
  category: hard_rust_niche_optimization
  description: "Option<Box<Node>> uses the null-pointer niche: None is a zero pointer, with no separate tag. sum_list is a
    pointer-chasing loop whose test is on the pointer itself. push allocates through __rust_alloc with an out-of-memory path,
    and the compiler also emits a recursive drop_in_place plus unwinding cleanup code placed after ret that is only reachable
    through exception tables."
  audience: experienced
  explanation_type: assembly
  input:
    language: Rust
    compiler: rustc 1.93.0
    compilationOptions: ["-C", "opt-level=2"]
    instructionSet: x86_64
    code: |
      pub struct Node {
          val: i32,
          next: Option<Box<Node>>,
      }

      #[inline(never)]
      pub fn sum_list(mut cur: &Option<Box<Node>>) -> i32 {
          let mut s = 0;
          while let Some(n) = cur {
              s += n.val;
              cur = &n.next;
          }
          s
      }

      #[inline(never)]
      pub fn push(head: Option<Box<Node>>, val: i32) -> Option<Box<Node>> {
          Some(Box::new(Node { val, next: head }))
      }
