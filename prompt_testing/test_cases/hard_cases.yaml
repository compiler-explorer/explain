- id: hard_int128_multiply
  category: hard_wide_multiply
  description: "128-bit values travel in register pairs (low half first: rdi:rsi for the first argument, rdx:rcx for the second).
    One-operand mul writes rdx:rax implicitly; the full 128x128 low product is one widening mul plus two imul cross terms
    added into the high half. Which cross term uses which register is easy to garble."
