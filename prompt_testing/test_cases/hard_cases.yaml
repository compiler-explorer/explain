- id: hard_signed_div_const
  category: hard_magic_division
  description: "Signed division and modulo by constants become multiply-high, shifts and sign corrections instead of idiv.
    div7 uses a magic constant that is negative as a signed 32-bit value, so the dividend is added back after the high half
    is taken; mod10 computes the quotient then multiplies back by 10 with lea/add and subtracts; div16 adds a bias of 15 only
    for negative inputs via cmovns. Models often say it uses a divide or misstate which shift is the sign fix."
  audience: experienced
  explanation_type: assembly
  input:
    language: C
    compiler: x86-64 gcc 15.2
    compilationOptions: ["-O2"]
    instructionSet: x86_64
    code: |
      int div7(int x)  { return x / 7; }
      int mod10(int x) { return x % 10; }
      int div16(int x) { return x / 16; }
    asm:
    - text: 'div7:'
    - text: '        movsx   rax, edi'
      source:
        line: 1
    - text: '        imul    rax, rax, -1840700269'
      source:
        line: 1
    - text: '        shr     rax, 32'
      source:
        line: 1
    - text: '        add     eax, edi'
      source:
        line: 1
    - text: '        sar     edi, 31'
      source:
        line: 1
    - text: '        sar     eax, 2'
      source:
        line: 1
    - text: '        sub     eax, edi'
      source:
        line: 1
    - text: '        ret'
      source:
        line: 1
    - text: 'mod10:'
    - text: '        movsx   rax, edi'
      source:
        line: 2
    - text: '        mov     edx, edi'
      source:
        line: 2
    - text: '        imul    rax, rax, 1717986919'
      source:
        line: 2
    - text: '        sar     edx, 31'
      source:
        line: 2
    - text: '        sar     rax, 34'
      source:
        line: 2
    - text: '        sub     eax, edx'
      source:
        line: 2
    - text: '        lea     edx, [rax+rax*4]'
      source:
        line: 2
    - text: '        mov     eax, edi'
      source:
        line: 2
    - text: '        add     edx, edx'
      source:
        line: 2
    - text: '        sub     eax, edx'
      source:
        line: 2
    - text: '        ret'
      source:
        line: 2
    - text: 'div16:'
    - text: '        test    edi, edi'
      source:
        line: 3
    - text: '        lea     eax, [rdi+15]'
