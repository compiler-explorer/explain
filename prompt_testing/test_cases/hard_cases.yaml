- id: hard_virtual_vs_final
  category: hard_devirtualization
  description: "gcc speculatively devirtualises the call through the base reference: it loads the vtable slot, compares it
    to the address of Square::area, runs the inlined body if equal and otherwise falls back to an indirect jmp. The call through
    a final class is fully inlined. total_sides speculatively inlines the base call too (folding 4 + 4 to 8 when the slot
    matches Square::sides) and only calls through the vtable, then adds 4, in the fallback path. Claiming that every call
    is virtual, or that none are, is wrong."
  audience: experienced
  explanation_type: assembly
  input:
    language: C++
    compiler: x86-64 gcc 15.2
    compilationOptions: ["-O2"]
    instructionSet: x86_64
    code: |
      struct Shape {
          virtual int sides() const = 0;
          virtual int area() const = 0;
      };

      struct Square final : Shape {
          int s;
          int sides() const override { return 4; }
          int area() const override { return s * s; }
      };

      int area_via_base(const Shape& sh)   { return sh.area(); }
      int area_via_final(const Square& sq) { return sq.area(); }
      int total_sides(const Shape& a, const Square& b) { return a.sides() + b.sides(); }
