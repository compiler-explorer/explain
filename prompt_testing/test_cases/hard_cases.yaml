- id: hard_exception_cleanup
  category: hard_landing_pads
  description: "Landing pads for a destructor during unwinding and for catch(...) are emitted after the function's ret (in
    a cold section), reached only through the exception tables, never by a visible branch or fall-through. The cleanup calls
