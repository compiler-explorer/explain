- id: hard_a64_ccmp_select
  category: hard_aarch64_conditional_compare
  description: "ccmp performs the second comparison only if the first condition held, otherwise it loads the immediate NZCV
    value (#4 sets Z, which makes eq true in either_zero and gt false in both_positive); cset then materialises the boolean.
    has_flag is a single ubfx bit extract and pick is tst plus csel. The ccmp semantics and the inverted-looking condition
    codes are routinely described incorrectly."
