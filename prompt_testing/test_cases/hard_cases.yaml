- id: hard_vector_push_back
  category: hard_vector_growth
  description: "push_back in a loop with the growth path inlined: capacity check, store and end-pointer bump on the fast path,
    operator new / memcpy / operator delete on the slow path, and a throw of length_error moved to a cold section. The fast-path
    block sits above the loop head and is entered by a jmp, so the loop shape (which label is the header, which is the back-edge)
    is easy to get wrong."
