- id: hard_fma_horner
  category: hard_fused_multiply_add
  description: "With -mfma the vfmadd132/213/231 forms differ in which operand is the addend and which register is overwritten,
    so the digits say which operands are multiplied and which is the addend, with the first operand always the destination.
    horner3 chains three fused steps with the result landing in xmm0 (x's register); dot4 evaluates the a[1]*b[1] product
    first with a plain vmulss and fuses the other three terms into it, with memory operands as the third source."
