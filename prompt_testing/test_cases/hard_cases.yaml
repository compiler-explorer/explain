- id: hard_fn_ptr_table
  category: hard_function_pointer_dispatch
  description: "A static const table of function pointers: with a constant index the call is resolved at compile time (apply_const
    is one imul and never touches the table), while the runtime-index version stays an indirect tail jump (jmp through a register
