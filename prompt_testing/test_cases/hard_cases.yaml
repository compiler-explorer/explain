  category: hard_riscv_loops
  description: "RISC-V has no flags: conditions are fused into branches such as ble a4,zero and bne against zero (what bnez
    expands to). count_pos computes an end pointer up front and reuses a1 and a0 for different roles (end pointer, then the
    counter), skips the increment with a forward branch, and loops on pointer inequality. 32-bit adds use addiw/addw to keep
    results sign-extended on rv64."
