      double horner3(double x, double a, double b, double c, double d) {
          return ((a * x + b) * x + c) * x + d;
      }

      float dot4(const float* a, const float* b) {
          return a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
